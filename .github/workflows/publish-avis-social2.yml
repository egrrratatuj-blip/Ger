name: Publish verified AvisTOLL Social2 files
on:
  push:
    branches: [avis-social2]
    paths: ['.github/workflows/publish-avis-social2.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: avis-social2
      - name: Reassemble and verify original APK and sanitized source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,base64,hashlib
          root=Path('AvisTOLL-Social2')
          transfer=root/'.transfer'
          manifest=json.loads((transfer/'manifest.json').read_text())
          for name,entry in manifest.items():
              data=base64.b64decode(''.join((transfer/'chunks'/p).read_text() for p in entry['chunks']),validate=True)
              assert len(data)==entry['bytes'],name
              assert hashlib.sha256(data).hexdigest()==entry['sha256'],name
              dest=root/('releases' if name.endswith('.apk') else 'source')/name
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_bytes(data)
              print(name,len(data),entry['sha256'])
          PY
          unzip -t AvisTOLL-Social2/releases/AvisTOLL-Social2-FRESH-NDK21-debug.apk | tail -n 1
          unzip -t AvisTOLL-Social2/source/AvisTOLL-Social2-FRESH-PUBLIC-SOURCE.zip | tail -n 1
          unzip -Z -1 AvisTOLL-Social2/releases/AvisTOLL-Social2-FRESH-NDK21-debug.apk | grep -Fx 'lib/arm64-v8a/libABridge.so'
          unzip -Z -1 AvisTOLL-Social2/releases/AvisTOLL-Social2-FRESH-NDK21-debug.apk | grep -Fx 'lib/arm64-v8a/libpine.so'
          rm -rf AvisTOLL-Social2/.transfer
      - name: Publish permanent direct-download links
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A AvisTOLL-Social2
          git commit -m 'release: publish verified Social2 APK and source [skip ci]'
          git push origin HEAD:avis-social2
